[package]
name = "redis_cli_async_client_v2"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.1", features = ["tokio-comp", "connection-manager"] }
tokio  = { version = "1",  features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
futures-util = "0.3.32"
